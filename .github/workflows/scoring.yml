name: Scoring CI and image delivery

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check every tracked SQL file
        run: uv run --no-project --python 3.12 --with sqlglot==28.5.0 python ci/sql_policy.py
      - name: Build the candidate image
        run: docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -f ci/Dockerfile -t "scoring-ci:$GITHUB_SHA" .
      - name: Test the image, migrations, API and backup restore
        run: bash ci/test-image.sh "scoring-ci:$GITHUB_SHA"
      - name: Export the exact image that passed verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save "scoring-ci:$GITHUB_SHA" | gzip > scoring-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: verified-scoring-image
          path: scoring-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deliver:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-scoring-image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image by commit SHA
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker load -i scoring-image.tar.gz
          docker tag "scoring-ci:$GITHUB_SHA" "$image"
          docker push "$image"
